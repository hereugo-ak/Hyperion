[project]
name = "hyperion"
version = "0.1.0"
description = "HYPERION — Deep Research Intelligence System for AI Consulting. Not a wrapper. A proprietary consulting model."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "HYPERION Consulting" }]

dependencies = [
    # LLM + structured output — all 4 providers expose OpenAI-compatible APIs
    "instructor>=1.4.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",

    # Data models + config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",

    # Search + extraction
    "duckduckgo-search>=6.0.0",
    "crawl4ai>=0.4.0",
    "trafilatura>=1.12.0",
    "pdfplumber>=0.11.0",  # D2.3: evidence-table extraction from PDF sources
    "curl_cffi>=0.7.0",
    "transformers>=4.44.0",
    "websockets>=12.0",
    # 5.4: vector-retrieval Second Brain. vector_brain.py degrades to a
    # deterministic hashing embedder + exact SQLite scan when these heavy
    # backends are absent (985MB CI sandbox); they are the production path.
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.0",
    # 5.5: yfinance global equity data (MarketDataClient). Imported lazily
    # inside market_data.py so the module stays importable on hosts without
    # it (985MB CI sandbox); MarketDataClient degrades to available=False.
    "yfinance>=0.2.40",
    # 5.6: PDF/A-2b + bookmarks post-pass (hyperion/output/pdf_postprocess.py).
    # Lazy-imported so the module stays importable without it; the render path
    # degrades to the un-post-processed PDF with a recorded warning.
    "pikepdf>=9.0.0",

    # Report generation — 300 DPI PDFs, Plotly charts, Pillow image pipeline
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    "markupsafe>=2.1.0",
    "plotly>=5.22.0",
    "kaleido>=0.2.1,<1.0",  # D26: pin to static engine (v1.x needs Chrome)
    "matplotlib>=3.8.0",  # D26: chart fallback when kaleido fails
    "pillow>=10.4.0",
    "fonttools>=4.53.0",  # D-15: subset embedded fonts to the report glyph budget
    "pymupdf>=1.24.0",  # fitz: PDF page-count + blank-page + font-embed verification
    "playwright>=1.46.0",  # Chromium PDF fallback when WeasyPrint native libs are unavailable

    # TUI — Textual + Rich + Typer
    "textual>=0.70.0",
    "rich>=13.7.0",
    "typer>=0.12.0",

    # Data sources
    "alpha-vantage>=3.0.0",
    "fredpy>=1.0.6",
    "pytrends>=4.7.3",
    "praw>=7.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    # D4.3: the kaleido/Chromium renderer can stall on a pipe read when the host
    # is out of memory (kaleido/scopes/base.py:308). A hang is indistinguishable
    # from a slow test without a hard per-test deadline, so --timeout is not
    # optional tooling — it is how that failure mode stays diagnosable in CI.
    "pytest-timeout>=2.3.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
stealth = [
    "nodriver>=0.36.0",     # P12: undetected Chrome automation
    "camoufox>=0.4.0",      # P12: stealth Firefox for anti-bot bypass
]

[project.scripts]
hyperion = "hyperion.cli:app"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyperion"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# BLE + S110/S112 added by 5.3 (audit §11 DoD #13): ban blind
# `except Exception:` (BLE001) and try-except-pass/continue (S110/S112).
# The 5.3 triage converted every silent handler to a recorded one and
# justified each remaining blanket catch with a per-site
# `noqa: BLE001 - <reason>`, so any NEW blind catch or silent swallow fails
# the gate. Only S110/S112 are selected, not the whole S family — the rest
# of bandit (S603 subprocess et al., 2000+ findings) is a separate audit.
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH", "BLE", "S110", "S112"]

# Rule families judged semantics-changing in this codebase during the
# 5.1e-continuation triage (see commits 989372d, 6acbdb3):
#   UP042 — str(StrEnum) interpolates as the value where str(str,Enum)-mixin
#           interpolates as "ClassName.MEMBER"; this codebase interpolates
#           enum members into prompts, paths, and exhibit text, so blanket
#           conversion silently rewrites client-facing strings.
#   TC001/TC002/TC003 — 7 of the 9 flagged production files define pydantic
#           BaseModels or dataclasses whose annotations are evaluated at
#           runtime; moving the import into TYPE_CHECKING breaks model
#           construction with NameError.
#   SIM112 — infra/services.py:279-281 reads genuine Windows env vars
#           (ProgramFiles, ProgramFiles(x86), ProgramW6432); "fixing" the
#           capitalization reads a different, empty variable on Windows.
# The 5.1e-continuation backlog (503 E501 long lines + 3 pre-judged benign
# sites) is quarantined per-file in [tool.ruff.lint.per-file-ignores] below
# so that NEW findings in these families still fail the gate.
ignore = ["UP042", "TC001", "TC002", "TC003", "SIM112"]

[tool.ruff.lint.per-file-ignores]
# Pre-judged benign sites (documented in 989372d):
"hyperion/router/wait_gate.py" = ["E501", "SIM103"]      # :128 deliberate nested condition
"hyperion/agents/delivery/render_engine.py" = ["E501", "SIM102"]  # :752 mirrors PyPDF2 fallback branch
"tools/audit_render_probe.py" = ["N802"]                 # def V — known-benign probe helper
# 5.1e-continuation E501 backlog (503 lines: 281 complete-code, 158 f-string,
# 52 no-open-bracket, 8 triple-quoted, 4 url/docstring — documented 6acbdb3).
# Quarantined so new long lines elsewhere fail; shrink this list as files are
# reflowed under a runnable test suite.
"hyperion/agents/base.py" = ["E501"]
"hyperion/cli.py" = ["E501"]
"hyperion/config.py" = ["E501"]
"hyperion/eval/harness.py" = ["E501"]
"hyperion/output/chart_specs.py" = ["E501"]
"hyperion/router/providers/base.py" = ["E501"]
"hyperion/schemas/research.py" = ["E501"]
"hyperion/schemas/workflow.py" = ["E501"]
"hyperion/tools/crawl4ai.py" = ["E501"]
"hyperion/tools/google_trends.py" = ["E501"]
"hyperion/agents/delivery/presentation_designer.py" = ["E501"]
"hyperion/agents/engagement_director.py" = ["E501"]
"hyperion/agents/specialists/*.py" = ["E501"]
"hyperion/agents/sub_agent.py" = ["E501"]
"hyperion/agents/synthesis_lead.py" = ["E501"]
"hyperion/agents/support/data_visualizer.py" = ["E501"]
"hyperion/agents/support/fact_checker.py" = ["E501"]
"hyperion/agents/support/quality_gate.py" = ["E501"]
"hyperion/agents/support/research_librarian.py" = ["E501"]
"hyperion/infra/services.py" = ["E501"]
"hyperion/obs/health.py" = ["E501"]
"hyperion/orchestrator.py" = ["E501"]
"hyperion/output/charts.py" = ["E501"]
"hyperion/output/images.py" = ["E501"]
"hyperion/output/markdown.py" = ["E501"]
"hyperion/output/render.py" = ["E501"]
"hyperion/router/router.py" = ["E501"]
"hyperion/schemas/models.py" = ["E501"]
"hyperion/tools/camoufox_client.py" = ["E501"]
"hyperion/tools/content_selector.py" = ["E501"]
"hyperion/tools/deep_search.py" = ["E501"]
"hyperion/tools/evidence_scorer.py" = ["E501"]
"hyperion/tools/hackernews.py" = ["E501"]
"hyperion/tools/pdf_tables.py" = ["E501"]
"hyperion/tools/query_planner.py" = ["E501"]
"hyperion/tools/query_utils.py" = ["E501"]
"hyperion/tools/reddit.py" = ["E501"]
"hyperion/tools/scrapling.py" = ["E501"]
"hyperion/tools/searxng.py" = ["E501"]
"hyperion/tools/second_brain.py" = ["E501"]
"hyperion/tools/stealth_search.py" = ["E501"]
"hyperion/tools/unsplash.py" = ["E501"]
"hyperion/tools/wayback.py" = ["E501"]
"hyperion/tools/world_bank.py" = ["E501"]
"hyperion/tools/__init__.py" = ["E501"]
"hyperion/tui/boot.py" = ["E501"]
"hyperion/tui/screens/engagement.py" = ["E501"]
"hyperion/tui/screens/splash.py" = ["E501"]
"hyperion/tui/widgets/metrics.py" = ["E501"]
"tests/test_evidence_scorer_relevance.py" = ["E501"]
"tests/test_font_embedding.py" = ["E501"]
"tests/test_p13.py" = ["E501"]
"tests/test_tools.py" = ["E501"]
"tests/test_unified_extract_ladder.py" = ["E501"]
"tests/test_wait_gate.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# Strict typing applies to every project module. Third-party packages without
# stubs get ignore_missing_imports only; the code that imports them remains
# fully checked.
[[tool.mypy.overrides]]
# Optional and untyped third-party packages imported by checked modules.
# warn_unused_configs ensures obsolete patterns are removed as dependencies
# gain type information or imports disappear.
module = [
    "textual.*", "trafilatura", "weasyprint", "transformers", "plotly.*",
    "matplotlib.*", "PIL.*", "fitz", "pdfplumber",
    "crawl4ai", "curl_cffi", "curl_cffi.*", "praw", "pytrends.*", "scrapling.*",
    "nodriver", "camoufox", "camoufox.*", "playwright.*", "playwright_stealth", "aiohttp",
    "websockets", "jinja2", "markupsafe", "openai", "httpx",
    "rich.*", "typer", "PyPDF2", "yaml",
    "sqlite_vec", "sentence_transformers",
    "yfinance", "pikepdf", "fontTools", "fontTools.*",
]
ignore_missing_imports = true
