# HYPERION SearXNG base profile (W-11)
#
# Governing policy: only documented APIs and independent crawlers are allowed.
# Engines that CAPTCHA, IP-ban, or proxy a blocking upstream are Tier C and
# must not appear here. Inherit current core settings while keeping only the
# audited engine allowlist, so image upgrades cannot silently reintroduce an
# engine or omit newly required application settings.

use_default_settings:
  engines:
    keep_only:
      - wikipedia
      - openstreetmap
      - github
      - stackexchange
      - hackernews
      - arxiv
      - crossref
      - openalex
      - pubmed
      - semantic scholar
      - mojeek
      - mwmbl
      - brave
      - yep
      # OVERHAUL4 P6.2 (probe 2026-08-11): marginalia/wiby are NOT in the
      # image (wiby FileNotFoundError in container log) — do not declare them.
      # wikidata IS in the image (reference class) and must stay listed here
      # so keep_only == declared (W-11 exact-match contract).
      - wikidata

general:
  instance_name: "HYPERION Search"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

# SearXNG reads this at the document root (not under ``search``). Keeping it
# explicit also makes the configured resolver deterministic across image tags.
default_doi_resolver: "doi.org"

# One DOI map only. Duplicate YAML keys silently overwrite each other and are
# rejected by tests/test_w11_search_registry.py.
doi_resolvers:
  doi.org: "https://doi.org/"
  oadoi.org: "https://oadoi.org/"
  doai.io: "https://dissem.in/"

server:
  # The official container entrypoint substitutes SEARXNG_SECRET at startup.
  # services.py supplies a generated or operator-provided value; no shared
  # placeholder secret is committed to source control.
  secret_key: "${SEARXNG_SECRET}"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true
  default_locale: "en"
  default_theme: "simple"
  themes:
    - simple

# Conservative single-user limits. HYPERION additionally applies a process-wide
# per-engine token bucket before each request, because SearXNG's limiter only
# protects the inbound endpoint and cannot govern upstream fan-out.
#
# F-03e (FIX0.3_RUNBOOK_2026-08-09): timeouts raised above the old 6-10s
# floor so slow/flaky upstreams (notably mwmbl) have room to answer instead
# of timing out into the unresponsive-engine bucket. max_request_timeout must
# stay >= the slowest per-engine timeout.
outgoing:
  request_timeout: 15.0
  max_request_timeout: 25.0
  pool_connections: 20
  pool_maxsize: 10
  enable_http2: true
  keepalive_expiry: 30
  useragent_suffix: "HYPERION research client (contact: ${HYPERION_CONTACT_EMAIL})"

engines:
  # Tier A: documented APIs
  # OVERHAUL2 S1: every engine carries an explicit ``categories`` LIST so the
  # generated replicas declare every category the client sends. The reference
  # replica previously declared only ``it``/implicit-general, so SearXNG
  # rejected ``categories=reference`` with HTTP 400 BEFORE any engine ran
  # (B-2: ``Invalid value: "['reference']"``) and the whole reference source
  # class was dead by config. Each list keeps the engine's original home and
  # adds the profile category it must answer.
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    categories: [general, reference]
    disabled: false
    timeout: 10
    weight: 1.0

  - name: arxiv
    engine: arxiv
    shortcut: ar
    categories: [science, general]
    disabled: false
    timeout: 12
    weight: 1.0

  - name: crossref
    engine: crossref
    shortcut: cr
    categories: [science, general]
    disabled: false
    timeout: 12
    weight: 1.0

  - name: openalex
    engine: openalex
    shortcut: oa
    categories: [science, medical, general]
    disabled: false
    timeout: 12
    weight: 1.0

  - name: pubmed
    engine: pubmed
    shortcut: pm
    categories: [science, medical, general]
    disabled: false
    timeout: 12
    weight: 0.8

  - name: semantic scholar
    engine: semantic_scholar
    shortcut: ss
    categories: [science, general]
    disabled: false
    timeout: 12
    weight: 1.0

  - name: github
    engine: github
    shortcut: gh
    categories: [it, reference]
    disabled: false
    timeout: 12
    weight: 0.8

  - name: stackexchange
    engine: stackexchange
    shortcut: se
    categories: [it, reference]
    disabled: false
    timeout: 12
    weight: 0.8

  - name: hackernews
    engine: hackernews
    shortcut: hn
    categories: [it, reference]
    disabled: false
    timeout: 10
    weight: 0.6

  - name: openstreetmap
    engine: openstreetmap
    shortcut: osm
    categories: [geo, general, reference]
    disabled: false
    timeout: 12
    weight: 0.6

  # Tier B: independent crawlers with their own indexes
  # P1.2 (overhaul §6 P1, 2026-08-10): mojeek/yep disabled — categorical 403
  # from this datacenter/VPS egress (Aug-10 autopsy: 403 for the whole run).
  # Kept declared so the W-12 replica registry stays disjoint and the running
  # instance still matches the code contract, but they must never receive
  # traffic again. The web corpus is mwmbl + brave behind engine health.
  - name: mojeek
    engine: mojeek
    shortcut: mj
    categories: [general]
    # OVERHAUL4 P6.2 (probe 2026-08-11): re-enabled — P1.2 disabled mojeek/yep
    # for the datacenter/VPS egress (403 x5+); egress is now a HOME IP, so
    # watch the container logs for 403s and disable again if they return.
    disabled: false
    timeout: 15
    weight: 1.0

  - name: mwmbl
    engine: mwmbl
    shortcut: mwm
    categories: [general, news]
    disabled: false
    timeout: 20
    weight: 0.8

  - name: brave
    engine: brave
    shortcut: br
    categories: [general, news]
    disabled: false
    timeout: 12
    weight: 1.0

  - name: yep
    engine: yep
    shortcut: yp
    categories: [general]
    # OVERHAUL4 P6.2: re-enabled for home-IP egress (see mojeek note).
    disabled: false
    timeout: 15
    weight: 0.6

  # OVERHAUL4 P6.2 (probe 2026-08-11): wikidata — structured-facts API engine,
  # keyless; present in the image (reference class). Init hit a 403 on first
  # boot; engine-health cools and retries.
  - name: wikidata
    engine: wikidata
    shortcut: wd
    categories: [general]
    disabled: false
    timeout: 15
    weight: 0.8
